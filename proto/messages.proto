syntax = "proto3";

package osgi;

message TransportMessage {
  string topic = 1;
  bytes payload = 2;
  int64 timestamp_ms = 3;
  string source = 4;
}
message DeviceFrame {
  enum ChannelType {
    CHANNEL_UNKNOWN = 0;
    CHANNEL_TCP = 1;
    CHANNEL_UDP = 2;
    CHANNEL_SERIAL = 3;
    CHANNEL_CAN = 4;
  }

  ChannelType channel = 1;
  string source = 2;
  string topic = 3;
  int64 timestamp_ms = 4;
  bytes payload = 5;
}
